name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Publishing authenticates through npm's trusted publisher (OIDC), which
      # needs Node >= 22.14 and npm >= 11.5.1 — newer than the runner's stock
      # pair. `changeset publish` shells out to whichever npm is on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@11.18.0

      - run: bun install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC auth alone does not attach attestations here; an explicit
          # request fails loud instead of silently skipping.
          NPM_CONFIG_PROVENANCE: "true"
